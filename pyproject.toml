[project]
name = "hypex"
version = "0.1.0"
description = "TradingView for comics hype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8.0", "pytest>=8.0.0"]

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker", "packages/sources/reddit"]

[tool.uv.sources]
hypex-core = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [".", "packages/core/src", "packages/sources/reddit/src"]
addopts = "--import-mode=importlib"
filterwarnings = [
    # Starlette 1.3.x warns that its TestClient will require httpx2; httpx2
    # isn't available in the ecosystem yet, so silence this third-party
    # deprecation to keep API test output clean. Revisit once httpx2 ships.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
